name: Post new jobs to Slack

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: post-jobs

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests
      - run: python -m jobbot.main collect
      # Save seen.json before posting: if this push fails, the post step is
      # skipped, so a job can be missed but never posted twice.
      - name: Save seen postings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "Update seen postings" && git push)
      - run: python -m jobbot.main post
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
